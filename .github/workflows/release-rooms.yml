name: Windows rooms release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v17.2.0)
        required: true
        default: v17.2.1
  push:
    branches: [master]
    paths:
      - docs/**

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version || 'v17.2.0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf fa
